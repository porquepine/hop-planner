name: Collect Space-A schedules

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (runs when the Mac collector is awake)
  workflow_dispatch:         # "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    # Runs on the owner's Mac (AMC blocks GitHub's own servers)
    runs-on: [self-hosted, hop-collector]
    timeout-minutes: 30
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/opt/gnu-tar/libexec/gnubin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4

      - name: Python packages
        run: |
          python3.12 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r requirements.txt

      - name: Collect schedules and roll calls
        env:
          SPACEA_USERS: ${{ secrets.SPACEA_USERS }}
          SPACEA_MASTER_KEY: ${{ secrets.SPACEA_MASTER_KEY }}
        run: '"$RUNNER_TEMP/venv/bin/python" collect.py'

      - name: Save the encrypted bundle
        run: |
          git config user.name "hop-planner-bot"
          git config user.email "hop-planner-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update schedules $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Build the website folder
        run: |
          rm -rf _site && mkdir -p _site
          cp index.html robots.txt data.json _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
